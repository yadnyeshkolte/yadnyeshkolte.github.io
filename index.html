<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Yadnyesh Kolte - Software Engineer Portfolio" />
  <meta name="theme-color" content="#89cff0" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />

  <!-- Inlined loader CSS to eliminate render-blocking request -->
  <style>
    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, white, lightblue, #89cff0);
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    .dark .initial-loader {
      background: radial-gradient(circle at top right, #2a2a2a, #1a1a1a);
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-top-color: #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .dark .spinner {
      border-color: rgba(255, 255, 255, 0.1);
      border-top-color: #60a5fa;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <title>Yadnyesh Kolte</title>
  <script>
    // Check for saved theme preference or default to light mode
    if (localStorage.getItem('darkMode') === 'true' ||
      (!localStorage.getItem('darkMode') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>

<body>
  <div class="initial-loader" id="initial-loader">
    <div class="spinner"></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
